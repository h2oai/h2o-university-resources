document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b0d316d0-7f51-4822-b72f-ffc598444d36\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* H2O.ai University — Color System\n * Source of truth: H2O.ai corporate Brand Kit (h2o.ai/company/brand-kit).\n * PRIMARY: Sunshine Yellow #FFDD00, Light Gray #F9F9F9, Black #000000.\n * Secondary yellows/greys/charcoal/white diversify the palette; yellow is\n * reserved to \"highlight, call out, and be a guidepost for the eye\".\n * Scales below are derived tints/shades of the three primaries (the brand\n * kit publishes them as swatch images only) — kept neutral and restrained.\n */\n:root {\n  /* ---- Brand primaries ---- */\n  --h2o-yellow: #FFDD00;        /* Sunshine Yellow — the signature accent */\n  --h2o-light-gray: #F9F9F9;    /* Light Gray — page / section background */\n  --h2o-black: #000000;         /* Black — primary ink */\n  --h2o-white: #FFFFFF;\n\n  /* ---- Yellow scale (tints of #FFDD00) ---- */\n  --yellow-700: #C7AB00;\n  --yellow-600: #E6C700;\n  --yellow-500: #FFDD00;        /* = --h2o-yellow */\n  --yellow-400: #FFE54D;\n  --yellow-300: #FFEC80;\n  --yellow-200: #FFF3B3;\n  --yellow-100: #FFFAE0;        /* soft wash behind callouts/highlights */\n\n  /* ---- Neutral / grey scale (Black → White) ---- */\n  --neutral-950: #0A0A0A;\n  --neutral-900: #1A1A1A;       /* charcoal — dark surfaces */\n  --neutral-800: #2E2E2E;\n  --neutral-700: #4D4D4D;       /* secondary ink */\n  --neutral-600: #6B6B6B;\n  --neutral-500: #808080;       /* muted ink */\n  --neutral-400: #A6A6A6;\n  --neutral-300: #CFCFCF;\n  --neutral-200: #E6E6E6;       /* borders / dividers */\n  --neutral-150: #EFEFEF;\n  --neutral-100: #F9F9F9;       /* = --h2o-light-gray */\n  --neutral-0:   #FFFFFF;\n\n  /* ---- Functional / status (used sparingly; never to compete with yellow) ---- */\n  --success-600: #1E874B;\n  --success-100: #E5F4EC;\n  --warning-600: #B7791F;\n  --warning-100: #FBF1DD;\n  --error-600:   #C0362C;\n  --error-100:   #F8E7E5;\n  --info-600:    #1F6FB2;\n  --info-100:    #E5F0F8;\n\n  /* ---- Difficulty levels (education-specific) ---- */\n  --level-beginner:     #1E874B;\n  --level-intermediate: #B7791F;\n  --level-advanced:     #C0362C;\n\n  /* ====================================================================\n   * SEMANTIC ALIASES — author UI against these, not the raw scales\n   * ==================================================================== */\n  --color-bg:            var(--neutral-0);\n  --color-bg-subtle:     var(--h2o-light-gray);\n  --color-bg-inverse:    var(--h2o-black);\n  --color-surface:       var(--neutral-0);\n  --color-surface-subtle:var(--h2o-light-gray);\n  --color-surface-inverse:var(--neutral-900);\n\n  --color-text:          var(--h2o-black);\n  --color-text-secondary:var(--neutral-700);\n  --color-text-muted:    var(--neutral-500);\n  --color-text-inverse:  var(--neutral-0);\n  --color-text-on-accent:var(--h2o-black);   /* black text on yellow */\n\n  --color-accent:        var(--h2o-yellow);\n  --color-accent-hover:  var(--yellow-600);\n  --color-accent-soft:   var(--yellow-100);\n  --color-accent-ink:    var(--h2o-black);\n\n  --color-border:        var(--neutral-200);\n  --color-border-strong: var(--neutral-300);\n  --color-border-inverse:var(--neutral-800);\n  --color-focus-ring:    var(--h2o-black);\n\n  --color-link:          var(--h2o-black);\n  --color-link-hover:    var(--neutral-700);\n}\n<\u002Fstyle>\n<style>/* H2O.ai University — Typography System\n * DM Sans (display/headers) · Inter (body) · DM Mono (captions, UPPERCASE).\n * Type scale is purpose-named; weights follow brand-kit recommendation:\n * Regular 400 / Medium 500 / Semibold 600 / Bold 700.\n */\n:root {\n  /* ---- Families ---- */\n  --font-display: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono:    'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* ---- Display / heading scale (DM Sans) ---- */\n  --text-display:   clamp(2.75rem, 1.6rem + 4.2vw, 4.5rem); /* @kind other */ /* hero */\n  --text-h1:        clamp(2.25rem, 1.5rem + 2.6vw, 3.25rem); /* @kind other */\n  --text-h2:        clamp(1.75rem, 1.25rem + 1.8vw, 2.5rem); /* @kind other */\n  --text-h3:        clamp(1.375rem, 1.1rem + 1vw, 1.75rem); /* @kind other */\n  --text-h4:        1.25rem;\n  --text-h5:        1.0625rem;\n\n  /* ---- Body (Inter) ---- */\n  --text-lead:      1.25rem;     /* intro paragraphs */\n  --text-body:      1rem;        /* default 16px */\n  --text-body-sm:   0.875rem;\n  --text-caption:   0.75rem;\n\n  /* ---- Mono / eyebrow (DM Mono, uppercase) ---- */\n  --text-eyebrow:   0.8125rem;\n  --text-mono-sm:   0.75rem;\n\n  /* ---- Line heights ---- */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-eyebrow: 0.12em;   /* DM Mono eyebrows / labels */\n}\n\n/* Convenience utility classes (optional; semantics live in components) */\n.h2o-display { font-family: var(--font-display); font-weight: var(--weight-bold);\n  font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }\n.h2o-h1 { font-family: var(--font-display); font-weight: var(--weight-bold);\n  font-size: var(--text-h1); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }\n.h2o-h2 { font-family: var(--font-display); font-weight: var(--weight-semibold);\n  font-size: var(--text-h2); line-height: var(--leading-snug); letter-spacing: var(--tracking-tight); }\n.h2o-h3 { font-family: var(--font-display); font-weight: var(--weight-semibold);\n  font-size: var(--text-h3); line-height: var(--leading-snug); }\n.h2o-body { font-family: var(--font-body); font-weight: var(--weight-regular);\n  font-size: var(--text-body); line-height: var(--leading-relaxed); color: var(--color-text-secondary); }\n.h2o-eyebrow { font-family: var(--font-mono); font-weight: var(--weight-medium);\n  font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase; color: var(--color-text-muted); }\n<\u002Fstyle>\n<style>/* H2O.ai University — Spacing & Layout\n * 4px base grid. Generous whitespace is a core brand principle.\n */\n:root {\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-wide: 1320px;\n  --gutter: clamp(1.25rem, 4vw, 4rem); /* @kind spacing */\n  --section-y: clamp(3.5rem, 6vw, 7rem); /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* H2O.ai University — Effects: radius, borders, shadows, motion\n * The brand reads clean and enterprise: modest radii, hairline borders,\n * soft low-contrast shadows. Yellow is never used in shadows.\n */\n:root {\n  /* ---- Radius ---- */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;     /* default card / input radius */\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-hairline: 1px solid var(--color-border);\n  --border-strong: 1.5px solid var(--color-border-strong);\n  --border-ink: 1.5px solid var(--h2o-black);\n\n  /* ---- Shadows (soft, neutral y #F9F9F9, Black #000000.\n * Secondary yellows/greys/charcoal/white diversify the palette; yellow is\n * reserved to \"highlight, call out, and be a guidepost for the eye\".\n * Scales below are derived tints/shades of the three primaries (the brand\n * kit publishes them as swatch images only) — kept neutral and restrained.\n */\n:root {\n  /* ---- Brand primaries ---- */\n  --h2o-yellow: #FFDD00;        /* Sunshine Yellow — the signature accent */\n  --h2o-light-gray: #F9F9F9;    /* Light Gray — page / section background */\n  --h2o-black: #000000;         /* Black — primary ink */\n  --h2o-white: #FFFFFF;\n\n  /* ---- Yellow scale (tints of #FFDD00) ---- */\n  --yellow-700: #C7AB00;\n  --yellow-600: #E6C700;\n  --yellow-500: #FFDD00;        /* = --h2o-yellow */\n  --yellow-400: #FFE54D;\n  --yellow-300: #FFEC80;\n  --yellow-200: #FFF3B3;\n  --yellow-100: #FFFAE0;        /* soft wash behind callouts/highlights */\n\n  /* ---- Neutral / grey scale (Black → White) ---- */\n  --neutral-950: #0A0A0A;\n  --neutral-900: #1A1A1A;       /* charcoal — dark surfaces */\n  --neutral-800: #2E2E2E;\n  --neutral-700: #4D4D4D;       /* secondary ink */\n  --neutral-600: #6B6B6B;\n  --neutral-500: #808080;       /* muted ink */\n  --neutral-400: #A6A6A6;\n  --neutral-300: #CFCFCF;\n  --neutral-200: #E6E6E6;       /* borders / dividers */\n  --neutral-150: #EFEFEF;\n  --neutral-100: #F9F9F9;       /* = --h2o-light-gray */\n  --neutral-0:   #FFFFFF;\n\n  /* ---- Functional / status (used sparingly; never to compete with yellow) ---- */\n  --success-600: #1E874B;\n  --success-100: #E5F4EC;\n  --warning-600: #B7791F;\n  --warning-100: #FBF1DD;\n  --error-600:   #C0362C;\n  --error-100:   #F8E7E5;\n  --info-600:    #1F6FB2;\n  --info-100:    #E5F0F8;\n\n  /* ---- Difficulty levels (education-specific) ---- */\n  --level-beginner:     #1E874B;\n  --level-intermediate: #B7791F;\n  --level-advanced:     #C0362C;\n\n  /* ====================================================================\n   * SEMANTIC ALIASES — author UI against these, not the raw scales\n   * ==================================================================== */\n  --color-bg:            var(--neutral-0);\n  --color-bg-subtle:     var(--h2o-light-gray);\n  --color-bg-inverse:    var(--h2o-black);\n  --color-surface:       var(--neutral-0);\n  --color-surface-subtle:var(--h2o-light-gray);\n  --color-surface-inverse:var(--neutral-900);\n\n  --color-text:          var(--h2o-black);\n  --color-text-secondary:var(--neutral-700);\n  --color-text-muted:    var(--neutral-500);\n  --color-text-inverse:  var(--neutral-0);\n  --color-text-on-accent:var(--h2o-black);   /* black text on yellow */\n\n  --color-accent:        var(--h2o-yellow);\n  --color-accent-hover:  var(--yellow-600);\n  --color-accent-soft:   var(--yellow-100);\n  --color-accent-ink:    var(--h2o-black);\n\n  --color-border:        var(--neutral-200);\n  --color-border-strong: var(--neutral-300);\n  --color-border-inverse:var(--neutral-800);\n  --color-focus-ring:    var(--h2o-black);\n\n  --color-link:          var(--h2o-black);\n  --color-link-hover:    var(--neutral-700);\n}\n\n/* H2O.ai University — Typography System\n * DM Sans (display/headers) · Inter (body) · DM Mono (captions, UPPERCASE).\n * Type scale is purpose-named; weights follow brand-kit recommendation:\n * Regular 400 / Medium 500 / Semibold 600 / Bold 700.\n */\n:root {\n  /* ---- Families ---- */\n  --font-display: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono:    'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;\n\n  /* ---- Weights ---- */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* ---- Display / heading scale (DM Sans) ---- */\n  --text-display:   clamp(2.75rem, 1.6rem + 4.2vw, 4.5rem); /* @kind other */ /* hero */\n  --text-h1:        clamp(2.25rem, 1.5rem + 2.6vw, 3.25rem); /* @kind other */\n  --text-h2:        clamp(1.75rem, 1.25rem + 1.8vw, 2.5rem); /* @kind other */\n  --text-h3:        clamp(1.375rem, 1.1rem + 1vw, 1.75rem); /* @kind other */\n  --text-h4:        1.25rem;\n  --text-h5:        1.0625rem;\n\n  /* ---- Body (Inter) ---- */\n  --text-lead:      1.25rem;     /* intro paragraphs */\n  --text-body:      1rem;        /* default 16px */\n  --text-body-sm:   0.875rem;\n  --text-caption:   0.75rem;\n\n  /* ---- Mono / eyebrow (DM Mono, uppercase) ---- */\n  --text-eyebrow:   0.8125rem;\n  --text-mono-sm:   0.75rem;\n\n  /* ---- Line heights ---- */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-eyebrow: 0.12em;   /* DM Mono eyebrows / labels */\n}\n\n/* Convenience utility classes (optional; semantics live in components) */\n.h2o-display { font-family: var(--font-display); font-weight: var(--weight-bold);\n  font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }\n.h2o-h1 { font-family: var(--font-display); font-weight: var(--weight-bold);\n  font-size: var(--text-h1); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }\n.h2o-h2 { font-family: var(--font-display); font-weight: var(--weight-semibold);\n  font-size: var(--text-h2); line-height: var(--leading-snug); letter-spacing: var(--tracking-tight); }\n.h2o-h3 { font-family: var(--font-display); font-weight: var(--weight-semibold);\n  font-size: var(--text-h3); line-height: var(--leading-snug); }\n.h2o-body { font-family: var(--font-body); font-weight: var(--weight-regular);\n  font-size: var(--text-body); line-height: var(--leading-relaxed); color: var(--color-text-secondary); }\n.h2o-eyebrow { font-family: var(--font-mono); font-weight: var(--weight-medium);\n  font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase; color: var(--color-text-muted); }\n\n/* H2O.ai University — Spacing & Layout\n * 4px base grid. Generous whitespace is a core brand principle.\n */\n:root {\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 3rem;      /* 48 */\n  --space-8: 4rem;      /* 64 */\n  --space-9: 6rem;      /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-wide: 1320px;\n  --gutter: clamp(1.25rem, 4vw, 4rem); /* @kind spacing */\n  --section-y: clamp(3.5rem, 6vw, 7rem); /* @kind spacing */\n}\n\n/* H2O.ai University — Effects: radius, borders, shadows, motion\n * The brand reads clean and enterprise: modest radii, hairline borders,\n * soft low-contrast shadows. Yellow is never used in shadows.\n */\n:root {\n  /* ---- Radius ---- */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;     /* default card / input radius */\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-hairline: 1px solid var(--color-border);\n  --border-strong: 1.5px solid var(--color-border-strong);\n  --border-ink: 1.5px solid var(--h2o-black);\n\n  /* ---- Shadows (soft, neutral) ---- */\n  --shadow-xs: 0 1px 2px rgba(16, 16, 16, 0.06);\n  --shadow-sm: 0 2px 6px rgba(16, 16, 16, 0.06);\n  --shadow-md: 0 6px 20px rgba(16, 16, 16, 0.08);\n  --shadow-lg: 0 16px 40px rgba(16, 16, 16, 0.10);\n  --shadow-focus: 0 0 0 3px rgba(255, 221, 0, 0.55);  /* yellow focus halo */\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n\n/* H2O.ai University — base element defaults (opt-in via global stylesheet) */\n:root {\n  color-scheme: light;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--text-body);\n  line-height: var(--leading-relaxed);\n  color: var(--color-text);\n  background: var(--color-bg);\n}\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  color: var(--color-text);\n  margin: 0;\n  letter-spacing: var(--tracking-tight);\n}\np { margin: 0; }\na { color: var(--color-link); text-decoration: none; }\na:hover { color: var(--color-link-hover); }\n*, *::before, *::after { box-sizing: border-box; }\n\n::selection { background: var(--h2o-yellow); color: var(--h2o-black); }\n\n:focus-visible {\n  outline: 2px solid var(--h2o-black);\n  outline-offset: 2px;\n}\n\n<\u002Fstyle>\n<script src=\"99ff7196-84c6-48a0-97da-9703fcf16169\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: #F9F9F9; }\n  a { color: #000000; text-decoration: none; border-bottom: 1px solid #FFDD00; }\n  a:hover { color: #4D4D4D; }\n  ::selection { background: #FFDD00; color: #000; }\n  @keyframes h2oFade { from { opacity: 0; } to { opacity: 1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #F9F9F9; font-family: var(--font-body); color: #000;\">\n\n  <div style=\"background: #000; color: #fff;\">\n    <div style=\"max-width: 1140px; margin: 0 auto; padding: 26px 32px 0; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n      <a href=\"index.html\" style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A6A6A6; border-bottom-color: #4D4D4D;\" style-hover=\"color: #FFDD00;\">← Back to the Pre-Sales Skills Track<\u002Fa>\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #FFDD00; border: 1px solid #4D4D4D; border-radius: 999px; padding: 5px 12px;\">Internal · confidential<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"max-width: 1140px; margin: 0 auto; padding: 40px 32px 64px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #FFDD00; margin-bottom: 18px;\">Reference guide · 02 · Battle card<\u002Fdiv>\n      <h1 style=\"color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 20px; max-width: 940px; text-wrap: pretty;\">RAG → Graph RAG → Agentic RAG → MAG<\u002Fh1>\n      <p style=\"font-family: var(--font-body); font-size: 18px; line-height: 1.6; color: #CFCFCF; max-width: 760px; margin: 0 0 38px; text-wrap: pretty;\">Four generations of retrieval, the competitors you will meet in each, and the talk tracks that hold up. <strong style=\"color: #fff;\">MAG — Memory-Augmented Generation<\u002Fstrong> — is the fourth: systems that retrieve persistent memories (conversations, preferences, goals) to personalize responses across sessions.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #2E2E2E; border: 1px solid #2E2E2E; max-width: 860px;\">\n        <div style=\"background: #FFDD00; color: #000; padding: 22px 20px;\">\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 32px;\">79.7<span style=\"font-size: 19px;\">%<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #4D4D4D; margin-top: 6px;\">GAIA world record · Jun 2025<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #000; padding: 22px 20px;\">\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 32px;\">#1<\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A6A6A6; margin-top: 6px;\">FutureX weekly peak<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #000; padding: 22px 20px;\">\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 32px;\">4<\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A6A6A6; margin-top: 6px;\">Native RAG modes<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #000; padding: 22px 20px;\">\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 32px;\">9<\u002Fdiv>\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A6A6A6; margin-top: 6px;\">Agent flavors<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid #E6E6E6; box-shadow: 0 1px 12px rgba(0,0,0,0.04);\">\n    <div style=\"max-width: 1140px; margin: 0 auto; padding: 14px 32px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;\">\n      <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"7\">\n        <button type=\"button\" sc-camel-on-click=\"{{ tb.pick }}\" style=\"display: flex; align-items: center; gap: 7px; flex: none; background: {{ tb.bg }}; border: 1px solid {{ tb.bd }}; border-radius: 999px; padding: 8px 12px 8px 8px; cursor: pointer;\" style-hover=\"border-color: #000;\">\n          <span style=\"width: 20px; height: 20px; flex: none; border-radius: 50%; background: {{ tb.numBg }}; color: {{ tb.numFg }}; font-family: var(--font-mono); font-size: 9px; display: flex; align-items: center; justify-content: center;\">{{ tb.num }}<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: {{ tb.fg }}; white-space: nowrap;\">{{ tb.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1140px; margin: 0 auto; padding: 56px 32px 90px;\">\n\n    <sc-if value=\"{{ isEvolution }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation: h2oFade 200ms ease;\">\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 12px;\">Four generations of retrieval<\u002Fh2>\n        <p style=\"font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: #4D4D4D; max-width: 700px; margin: 0 0 36px; text-wrap: pretty;\">Each generation exists because of a specific limitation in the one before it. Knowing which generation a prospect is on tells you exactly what to sell them next.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px;\">\n          <sc-for list=\"{{ generations }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"background: {{ g.bg }}; border: 1px solid {{ g.bd }}; border-radius: 14px; padding: 28px 30px; display: flex; flex-direction: column; gap: 14px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px;\">\n                <span style=\"width: 34px; height: 34px; border-radius: 8px; background: {{ g.chipBg }}; color: {{ g.chipFg }}; font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; justify-content: center;\">{{ g.n }}<\u002Fspan>\n                <div>\n                  <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B;\">{{ g.years }}<\u002Fdiv>\n                  <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2;\">{{ g.name }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #4D4D4D;\">{{ g.full }}<\u002Fdiv>\n              <p style=\"font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: #2E2E2E; margin: 0; max-width: 62ch; text-wrap: pretty;\">{{ g.desc }}<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n                <sc-for list=\"{{ g.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n                  <div style=\"display: grid; grid-template-columns: 10px 1fr; gap: 9px; align-items: start;\">\n                    <span style=\"color: #FFDD00; font-size: 12px; line-height: 1.4;\">·<\u002Fspan>\n                    <span style=\"font-family: var(--font-body); font-size: 13.5px; line-height: 1.5; color: #4D4D4D;\">{{ st }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid #E6E6E6; padding-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; flex: 1;\">\n                <div>\n                  <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 4px;\">Strengths<\u002Fdiv>\n                  <div style=\"font-family: var(--font-body); font-size: 13.5px; line-height: 1.55; color: #2E2E2E;\">{{ g.strengths }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 4px;\">{{ g.limitLabel }}<\u002Fdiv>\n                  <div style=\"font-family: var(--font-body); font-size: 13.5px; line-height: 1.55; color: #6B6B6B;\">{{ g.limit }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n                <sc-for list=\"{{ g.vendors }}\" as=\"vd\" hint-placeholder-count=\"3\">\n                  <span style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; color: #4D4D4D; background: #fff; border: 1px solid #E6E6E6; border-radius: 999px; padding: 5px 10px;\">{{ vd }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background: #000; color: #fff; border-radius: 16px; padding: 32px 34px; margin-bottom: 24px;\">\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 22px; color: #fff; margin: 0 0 6px;\">The GAIA journey<\u002Fh3>\n          <p style=\"font-family: var(--font-body); font-size: 13.5px; line-height: 1.6; color: #808080; margin: 0 0 26px; max-width: 700px;\">GAIA (General AI Assistants) — 466 real-world questions requiring reasoning, web browsing, tools and exact answers. The hardest public AI benchmark.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <sc-for list=\"{{ benchmarks }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"display: flex; justify-content: space-between; gap: 20px; margin-bottom: 7px; flex-wrap: wrap;\">\n                  <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ b.labelFg }};\">{{ b.label }}<\u002Fspan>\n                  <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 14px; color: #fff;\">{{ b.score }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height: 26px; border-radius: 6px; background: #1A1A1A; overflow: hidden;\">\n                  <div style=\"height: 26px; width: {{ b.width }}; background: {{ b.barBg }}; border-radius: 6px; display: flex; align-items: center; padding-left: 12px;\">\n                    <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: {{ b.barFg }}; white-space: nowrap;\">{{ b.note }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #fff; border: 1px solid #E6E6E6; border-radius: 14px; padding: 28px 30px;\">\n          <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0 0 18px;\">What comes after MAG<\u002Fh3>\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\">\n            <sc-for list=\"{{ frontier }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"background: #F9F9F9; border: 1px solid #E6E6E6; border-radius: 10px; padding: 18px 20px;\">\n                <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.3; margin-bottom: 9px;\">{{ f.title }}<\u002Fdiv>\n                <p style=\"font-family: var(--font-body); font-size: 13px; line-height: 1.55; color: #4D4D4D; margin: 0; text-wrap: pretty;\">{{ f.desc }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMag }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation: h2oFade 200ms ease;\">\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 12px;\">MAG, in depth<\u002Fh2>\n        <p style=\"font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: #4D4D4D; max-width: 700px; margin: 0 0 36px; text-wrap: pretty;\">The practical job of Memory-Augmented Generation is <strong>continuity<\u002Fstrong> — remembering the person across sessions. Here is how to talk about it when the prospect calls it something else.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px;\">\n          <div style=\"background: #fff; border: 1px solid #E6E6E6; border-radius: 14px; padding: 28px 30px;\">\n            <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #000; background: #FFF6B8; border-radius: 4px; padding: 5px 10px; display: inline-block; margin-bottom: 14px;\">Emerging · not yet standardized<\u002Fdiv>\n            <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.3; margin: 0 0 12px;\">Is \"Memory-Augmented Generation\" a common term?<\u002Fh3>\n            <p style=\"font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: #4D4D4D; margin: 0 0 20px; text-wrap: pretty;\">As of mid-2026, MAG is an emerging positioning term not yet standardized in vendor marketing. Research across Mem0, Zep, Graphlit and academic sources confirms the industry uses different terminology for the same concept. Expect to hear:<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <sc-for list=\"{{ magTerms }}\" as=\"mt\" hint-placeholder-count=\"6\">\n                <div style=\"display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid #F2F2F2;\">\n                  <span style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ mt.tagFg }}; background: {{ mt.tagBg }}; border-radius: 4px; padding: 4px 8px; text-align: center;\">{{ mt.tag }}<\u002Fspan>\n                  <span style=\"font-family: var(--font-body); font-size: 13.5px; line-height: 1.5; color: #2E2E2E;\"><strong>{{ mt.name }}<\u002Fstrong> — {{ mt.who }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid (--font-body); font-size: 13px; line-height: 1.55; color: #4D4D4D; margin: 0 0 14px;\">{{ vd.bestFor }}<\u002Fp>\n              <div style=\"background: #FFFAE0; border-left: 3px solid #FFDD00; border-radius: 4px; padding: 13px 15px;\">\n                <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 6px;\">vs. H2O.ai<\u002Fdiv>\n                <div style=\"font-family: var(--font-body); font-size: 13px; line-height: 1.55; color: #2E2E2E; text-wrap: pretty;\">{{ vd.vs }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isObjections }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation: h2oFade 200ms ease;\">\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 12px;\">Objection handling<\u002Fh2>\n        <p style=\"font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: #4D4D4D; max-width: 700px; margin: 0 0 36px; text-wrap: pretty;\">Eight objections you will hear, with the talk track and the proof point behind it. Open one to rehearse it before a call.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ objections }}\" as=\"o\" hint-placeholder-count=\"8\">\n            <div style=\"background: #fff; border: 1px solid {{ o.bd }}; border-left: 3px solid {{ o.accent }}; border-radius: 12px; overflow: hidden;\">\n              <div sc-camel-on-click=\"{{ o.toggle }}\" style=\"display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 20px 24px; cursor: pointer;\" style-hover=\"background: #FCFCFC;\">\n                <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.35;\">“{{ o.q }}”<\u002Fdiv>\n                <span style=\"width: 28px; height: 28px; border-radius: 50%; border: 1px solid #E6E6E6; color: #000; font-size: 10px; display: flex; align-items: center; justify-content: center;\">{{ o.chev }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ o.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 0 24px 22px; animation: h2oFade 180ms ease;\">\n                  <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 8px;\">Talk track<\u002Fdiv>\n                  <p style=\"font-family: var(--font-body); font-size: 16px; line-height: 1.7; color: #1A1A1A; margin: 0 0 18px; max-width: 76ch; text-wrap: pretty;\">{{ o.answer }}<\u002Fp>\n                  <div style=\"background: #F9F9F9; border: 1px solid #E6E6E6; border-radius: 8px; padding: 14px 16px; max-width: 860px;\">\n                    <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 6px;\">Proof point<\u002Fdiv>\n                    <div style=\"font-family: var(--font-body); font-size: 13.5px; line-height: 1.55; color: #2E2E2E;\">{{ o.proof }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDiscovery }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation: h2oFade 200ms ease;\">\n        <h2 style=\"font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 12px;\">Discovery questions<\u002Fh2>\n        <p style=\"font-family: var(--font-body); font-size: 16px; line-height: 1.65; color: #4D4D4D; max-width: 700px; margin: 0 0 36px; text-wrap: pretty;\">Twenty questions across four themes to qualify the opportunity and surface pain, plus the pitch and the numbers to have ready.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;\">\n          <sc-for list=\"{{ discovery }}\" as=\"dg\" hint-placeholder-count=\"4\">\n            <div style=\"background: #fff; border: 1px solid #E6E6E6; border-radius: 14px; padding: 26px 28px;\">\n              <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0 0 18px;\">{{ dg.title }}<\u002Fh3>\n              <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                <sc-for list=\"{{ dg.questions }}\" as=\"q\" hint-placeholder-count=\"5\">\n                  <div style=\"border-left: 2px solid #FFDD00; padding-left: 14px; font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: #2E2E2E; text-wrap: pretty;\">{{ q }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFDD00; color: #000; border-radius: 16px; padding: 32px 34px; margin-bottom: 24px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #4D4D4D; margin-bottom: 12px;\">30-second elevator pitch<\u002Fdiv>\n          <p style=\"font-family: var(--font-body); font-size: 17px; line-height: 1.6; color: #000; margin: 0; max-width: 900px; text-wrap: pretty;\">H2O.ai is the only enterprise AI platform that spans all four generations of RAG — from classic RAG to Graph RAG to Agentic RAG to Memory-Augmented Generation — in a single sovereign platform. We hold the world record on GAIA at 79.7% accuracy, beating OpenAI, Google and every other vendor. Unlike LangChain, Glean, Cohere or Writer, we combine predictive AutoML, generative AI and agentic AI with built-in memory, MRM governance and on-premises deployment. Your AI remembers your users, builds ML models, and runs in your environment — all from one platform.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\">\n          <sc-for list=\"{{ quickRef }}\" as=\"qr\" hint-placeholder-count=\"3\">\n            <div style=\"background: #fff; border: 1px solid #E6E6E6; border-radius: 14px; padding: 24px 26px;\">\n              <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 14px;\">{{ qr.title }}<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                <sc-for list=\"{{ qr.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n                  <div style=\"font-family: var(--font-mono); font-size: 12px; line-height: 1.5; color: #2E2E2E;\">{{ it }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding-top: 56px;\">\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n        <sc-if value=\"{{ hasPrev }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goPrev }}\" style=\"text-align: left; background: #fff; border: 1px solid #E6E6E6; border-radius: 14px; padding: 22px 26px; cursor: pointer;\" style-hover=\"border-color: #000;\">\n            <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 7px;\">← Previous<\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.3;\">{{ prevLabel }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noPrev }}\" hint-placeholder-val=\"{{ true }}\">\n          <span><\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goNext }}\" style=\"text-align: right; background: #000; border: 1px solid #000; border-radius: 14px; padding: 22px 26px; cursor: pointer;\" style-hover=\"border-color: #FFDD00;\">\n            <div style=\"font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #FFDD00; margin-bottom: 7px;\">Next →<\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.3; color: #fff;\">{{ nextLabel }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"background: #000;\">\n    <div style=\"max-width: 1140px; margin: 0 auto; padding: 26px 32px; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6B6B;\">\n      <a href=\"index.html\" style=\"color: #6B6B6B; border-bottom-color: #2E2E2E;\" style-hover=\"color: #FFDD00;\">← Back to the Pre-Sales Skills Track<\u002Fa>\n      <span>Rafael Coss · content — Andreea Turcu · design<\u002Fspan>\n      <span>Internal presales use only — not for external distribution<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst TABS = [\n  { id: \"evolution\", label: \"RAG evolution\" },\n  { id: \"mag\", label: \"MAG deep dive\" },\n  { id: \"leaders\", label: \"Market leaders\" },\n  { id: \"positioning\", label: \"H2O.ai\" },\n  { id: \"matrix\", label: \"Matrix\" },\n  { id: \"objections\", label: \"Objections\" },\n  { id: \"discovery\", label: \"Discovery\" },\n];\n\nconst GENERATIONS = [\n  { n: \"G1\", name: \"Classic RAG\", full: \"Retrieval-Augmented Generation\", years: \"2020–2023\",\n ything production-ready. H2O.ai gives you a proven platform with 79.7% GAIA accuracy, nine agent flavors, four RAG modes, memory and H2O MRM — all on day one. What is the cost of 18 months of delay while competitors move faster?\",\n    proof: \"Build vs. buy: a custom RAG stack is 12–18 months and $2–5M+ with no benchmark proof. H2O.ai is a proven platform with day-one deployment and world-record accuracy.\" },\n  { q: \"We do not need memory — our use case is stateless\",\n    answer: \"That is fine — h2oGPTe supports all four RAG modes including stateless classic RAG and Agentic RAG. Memory is optional. But consider: as your AI matures, users will expect it to remember them. Building on H2O.ai means you can add memory when you are ready without switching platforms.\",\n    proof: \"H2O.ai supports stateless AND stateful use cases. You can start stateless and add memory later without platform migration.\" },\n];\n\nconst DISCOVERY = [\n  { title: \"Current state\", questions: [\n    \"What RAG or AI search solution are you using today — LangChain, LlamaIndex, Glean, Cohere, Writer, or something custom?\",\n    \"How many documents or data sources does your current system retrieve from?\",\n    \"Does your current AI remember users across sessions, or does every conversation start fresh?\",\n    \"How do you handle multi-hop questions that require connecting information across multiple documents?\",\n    \"What is your current retrieval accuracy, and how do you measure it?\",\n  ]},\n  { title: \"Governance and compliance\", questions: [\n    \"Do you operate in a regulated industry — banking, healthcare, government or defence?\",\n    \"Do you have SR 11-7 model risk management requirements for your AI systems?\",\n    \"Can your current AI vendor deploy fully on-premises or in an air-gapped environment?\",\n    \"Who owns your data when it is processed by your current AI vendor?\",\n    \"Do you have audit trail requirements for AI-generated outputs?\",\n  ]},\n  { title: \"Memory and personalization\", questions: [\n    \"Do your users expect the AI to remember them across sessions — their preferences, past decisions and goals?\",\n    \"Are you building a personal assistant, copilot, coaching tool or health companion that needs continuity?\",\n    \"How do you currently handle context from previous conversations in your AI workflows?\",\n    \"Have you evaluated Mem0, Zep or Letta for persistent memory? What were the integration challenges?\",\n    \"What would it mean for your users if the AI remembered their context without them repeating themselves?\",\n  ]},\n  { title: \"Future state and expansion\", questions: [\n    \"Are you planning to expand from document Q&A to autonomous agents that take actions?\",\n    \"Do you need both predictive ML models and generative AI in the same platform?\",\n    \"What is your timeline for moving from prototype to production-grade enterprise AI?\",\n    \"How important is it that your AI platform can run on your own cloud or on-premises infrastructure?\",\n    \"What would a 79.7% accuracy rate on real-world AI tasks mean for your business outcomes?\",\n  ]},\n];\n\nconst QUICK_REF = [\n  { title: \"Key URLs\", items: [\"docs.h2o.ai/enterprise-h2ogpte/changelog\", \"h2o.ai/blog\", \"futurex.live (live leaderboard)\", \"gaia-benchmark.com\"] },\n  { title: \"Key numbers\", items: [\"79.7% GAIA world record (Jun 2025)\", \"75% GAIA #1 (Mar 2025)\", \"65% GAIA #1 (Dec 2024)\", \"FutureX #1 peak / #2 overall (2026)\", \"9 agent flavors\", \"4 RAG modes\", \"250+ MCP tools\"] },\n  { title: \"Key versions\", items: [\"h2oGPTe v1.7.5-2 (current)\", \"Graph RAG: v1.7.3-post1\", \"Auto Memory Blocks: v1.7.1\", \"Agent Tool Memory: v1.7.3-post1\", \"MCP Server: v1.7.0\", \"HITL: v1.7.0\", \"Fast Agentic RAG: v1.7.0\"] },\n];\n\nclass Component extends DCLogic {\n  state = { tab: \"evolution\", openObj: null };\n\n  renderVals() {\n    const tab = this.state.tab;\n    const openObj = this.state.openObj;\n\n    const ti = Math.max(0, TABS.findIndex((x) => x.id === tab));\n    const prev = ti > 0 ? TABS[ti - 1] : null;\n    const next = ti < TABS.length - 1 ? TABS[ti + 1] : null;\n\n    return {\n      tabs: TABS.map((t, i) => {\n        const on = tab === t.id;\n        return {\n          num: String(i + 1).padStart(2, \"0\"),\n          label: t.label,\n          pick: () => this.setState({ tab: t.id }),\n          bg: on ? \"#000000\" : \"#FFFFFF\",\n          bd: on ? \"#000000\" : \"#E6E6E6\",\n          fg: on ? \"#FFFFFF\" : \"#4D4D4D\",\n          numBg: on ? \"#FFDD00\" : \"#F2F2F2\",\n          numFg: on ? \"#000000\" : \"#6B6B6B\",\n        };\n      }),\n      hasPrev: !!prev, noPrev: !prev, prevLabel: prev ? prev.label : \"\",\n      hasNext: !!next, nextLabel: next ? next.label : \"\",\n      goPrev: () => prev && this.setState({ tab: prev.id }),\n      goNext: () => next && this.setState({ tab: next.id }),\n      isEvolution: tab === \"evolution\",\n      isMag: tab === \"mag\",\n      isLeaders: tab === \"leaders\",\n      isPositioning: tab === \"positioning\",\n      isMatrix: tab === \"matrix\",\n      isObjections: tab === \"objections\",\n      isDiscovery: tab === \"discovery\",\n\n      generations: GENERATIONS.map((g) => ({\n        n: g.n, name: g.name, full: g.full, years: g.years, desc: g.desc,\n        steps: g.steps, strengths: g.strengths, limitLabel: g.limitLabel, limit: g.limit, vendors: g.vendors,\n        bg: g.accent ? \"#FFFDF0\" : \"#FFFFFF\",\n        bd: g.accent ? \"#FFDD00\" : \"#E6E6E6\",\n        chipBg: g.accent ? \"#FFDD00\" : \"#000000\",\n        chipFg: g.accent ? \"#000000\" : \"#FFDD00\",\n      })),\n      benchmarks: BENCHMARKS.map((b) => ({\n        label: b.label, score: b.score, note: b.note,\n        width: b.pct + \"%\",\n        barBg: b.hl ? \"#FFDD00\" : \"#3A3A3A\",\n        barFg: b.hl ? \"#000000\" : \"#CFCFCF\",\n        labelFg: b.hl ? \"#FFDD00\" : \"#808080\",\n      })),\n      frontier
